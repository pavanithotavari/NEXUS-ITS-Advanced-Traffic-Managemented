
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-traffic"
version = "0.1.0"
description = "Edge AI traffic management: real-time adaptive signal control using ML and neural networks to cut congestion"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scikit-learn",
    "pyyaml",
    "joblib",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
